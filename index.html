<style>
:root{
  --canvas:#F4F4F6; --surface:#FFFFFF; --surface-sunk:#FAFAFA;
  --border:#E6E6EA; --border-strong:#D7D7DD;
  --ink:#1C1C1E; --ink-soft:#6C6C72; --ink-faint:#A6A6AC;
  --accent:#3457D5; --accent-ink:#2540A8; --accent-tint:#EAEFFC;
  --gain:#0E9F6E; --gain-tint:#E7F8F1;
  --violet:#6D3FD1; --violet-tint:#F1ECFC;
  --radius-m:14px; --radius-l:20px; --radius-full:999px;
  --shadow-1:0 1px 2px rgba(20,20,25,.04);
  --shadow-2:0 6px 20px rgba(20,20,25,.07);
  --shadow-3:0 20px 60px rgba(20,20,25,.16);
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-spring:cubic-bezier(.34,1.4,.44,1);
  --font-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--canvas); color:var(--ink);
  font-family:var(--font-ui); -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility; letter-spacing:-.006em;
  overscroll-behavior-y:none; overflow:hidden;
}
button{font-family:inherit;}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--radius-m);}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;animation-delay:0s !important;}}

/* ============ LAUNCH SCREEN (extracted from the original) ============ */
.launch-screen{
  isolation:isolate; position:fixed; inset:0; z-index:9999;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  background:linear-gradient(155deg,var(--accent),var(--accent-ink));
  animation:launchOut .5s var(--ease) 2.6s forwards;
}
.launch-screen::before{
  content:""; position:absolute; inset:0; z-index:-1;
  background:linear-gradient(155deg,#766AEE,#887FF5);
  opacity:0; animation:launchHue 1.1s ease-in-out 1.3s forwards;
}
@keyframes launchHue{from{opacity:0;}to{opacity:1;}}
.launch-mark{width:96px;height:96px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.25));animation:launchMarkIn .6s var(--ease-spring) both;}
.launch-name{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.01em;color:#fff;opacity:0;animation:launchNameIn .5s var(--ease) .25s both;}
@keyframes launchMarkIn{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:scale(1);}}
@keyframes launchNameIn{from{opacity:0;transform:translateY(4px);}to{opacity:.92;transform:translateY(0);}}
@keyframes launchOut{from{opacity:1;visibility:visible;}to{opacity:0;visibility:hidden;pointer-events:none;}}

/* ============ VERSION CHOOSER ============ */
.chooser{
  min-height:100vh; min-height:100dvh; height:100%;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  display:flex; align-items:center; justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
}
.chooser-inner{width:100%;max-width:720px;margin:auto;}
.chooser-head{text-align:center;margin-bottom:28px;opacity:0;animation:rise .5s var(--ease) 3.0s both;}
.chooser-mark{width:60px;height:60px;margin:0 auto 14px;display:block;padding:10px;border-radius:16px;background:linear-gradient(155deg,#766AEE,#887FF5);box-shadow:var(--shadow-2);}
.chooser-title{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;}
.chooser-sub{font-size:14.5px;color:var(--ink-soft);margin:0;line-height:1.5;}

.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.option{
  position:relative; text-align:left; cursor:pointer; min-width:0;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l);
  padding:22px; box-shadow:var(--shadow-1);
  display:flex; flex-direction:column; gap:16px; color:inherit;
  opacity:0; animation:rise .5s var(--ease) both;
  transition:box-shadow .2s var(--ease),transform .2s var(--ease),border-color .2s;
}
.option:nth-child(1){animation-delay:3.1s;}
.option:nth-child(2){animation-delay:3.2s;}
.option:hover{box-shadow:var(--shadow-2);border-color:var(--border-strong);transform:translateY(-2px);}
.option:active{transform:scale(.98);}
.option.is-stable:hover{border-color:var(--accent);}
.option.is-beta:hover{border-color:var(--violet);}
.option.leaving{pointer-events:none;}

.opt-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.opt-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.opt-icon .icon{width:22px;height:22px;}
.is-stable .opt-icon{background:var(--accent-tint);color:var(--accent-ink);}
.is-beta .opt-icon{background:var(--violet-tint);color:var(--violet);}
.badge{font-size:11px;font-weight:700;letter-spacing:.01em;padding:4px 9px;border-radius:var(--radius-full);white-space:nowrap;}
.is-stable .badge{background:var(--gain-tint);color:var(--gain);}
.is-beta .badge{background:var(--violet-tint);color:var(--violet);}

.opt-name{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;}
.opt-desc{font-size:13.5px;color:var(--ink-soft);margin:0;line-height:1.5;}
.opt-foot{
  margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding-top:14px;border-top:1px solid var(--border);
  font-size:13px;font-weight:600;
}
.is-stable .opt-foot{color:var(--accent-ink);}
.is-beta .opt-foot{color:var(--violet);}
.opt-foot .icon{width:16px;height:16px;transition:transform .2s var(--ease-spring);}
.option:hover .opt-foot .icon{transform:translateX(3px);}

.chooser-note{text-align:center;font-size:12px;color:var(--ink-faint);margin:20px 0 0;opacity:0;animation:rise .5s var(--ease) 3.3s both;}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.fade-out .chooser{opacity:0;transform:scale(.985);transition:opacity .25s var(--ease),transform .25s var(--ease);}

@media (max-width:640px){
  .options{grid-template-columns:minmax(0,1fr);gap:12px;}
  .option{padding:18px;gap:14px;}
  .chooser-title{font-size:23px;}
  .chooser-head{margin-bottom:22px;}
}
@media (max-width:360px){
  .chooser{padding-left:14px;padding-right:14px;}
  .opt-name{font-size:17px;}
}
@media (max-height:520px) and (orientation:landscape){
  .chooser{align-items:flex-start;}
  .chooser-mark{display:none;}
}
</style>
</head>

<script>
(function(){
  // Remove the splash from the DOM once its fade-out has finished
  setTimeout(function(){
    var ls = document.getElementById("launchScreen");
    if(ls) ls.remove();
  }, 3100);

  // Redirect on selection, with a short fade
  document.querySelectorAll(".option").forEach(function(btn){
    btn.addEventListener("click", function(){
      var href = btn.getAttribute("data-href");
      btn.classList.add("leaving");
      document.body.classList.add("fade-out");
      setTimeout(function(){ window.location.href = href; }, 220);
    });
  });
})();
</script>
